[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "electorallens-backend"
version = "0.1.0"
description = "ElectoralLens AI — electoral intelligence platform backend"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "greenlet>=3.0",

    # Cache
    "redis>=5.0",

    # Config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",

    # HTTP / Scraping
    "httpx>=0.27",
    "tenacity>=8.3",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",

    # Analytics / ML
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "geopandas>=0.14",
    "shapely>=2.0",

    # AI
    "langchain>=0.2",
    "langchain-community>=0.2",
    "ollama>=0.2",

    # Observability
    "prometheus-fastapi-instrumentator>=7.0",
    "structlog>=24.0",

    # Utils
    "rich>=13.7",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
